name: Unit tests

on:
  push:
    branches:
      - limine
  pull_request:
    branches:
      - limine

jobs:
  hosted-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build g++ dosfstools

      - name: Create FAT32 test image
        run: |
          truncate -s 300M tests/test.img
          mkfs.fat -F 32 -s 8 -n VesperaTest tests/test.img

      - name: Configure
        run: cmake -S tests -B tests/build -G Ninja -DCMAKE_BUILD_TYPE=Debug

      - name: Build
        run: cmake --build tests/build

      - name: Run tests (ctest)
        run: ctest --test-dir tests/build --output-on-failure
