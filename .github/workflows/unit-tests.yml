name: Unit tests

on:
  push:
    branches:
      - limine
  pull_request:
    branches:
      - limine

jobs:
  hosted-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Include hygiene check
        run: python3 scripts/check_include_hygiene.py

      - name: Include boundary check
        run: python3 scripts/check_include_boundaries.py

      - name: Install build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build g++ dosfstools e2fsprogs

      - name: Create FAT32 test image
        run: |
          dd if=/dev/zero of=tests/test.img bs=512 count=70000
          mkfs.fat -F 32 -S 512 tests/test.img

      - name: Configure
        run: cmake -S . -B cmake-build-tests -G Ninja -DCMAKE_BUILD_TYPE=Debug -DVESPERA_BUILD_TESTS=ON

      - name: Build
        run: cmake --build cmake-build-tests

      - name: Run tests (ctest)
        run: ctest --test-dir cmake-build-tests --output-on-failure
